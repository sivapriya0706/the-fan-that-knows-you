<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#0A1329" stroke="#00F0FF" stroke-width="2.5" />
  <circle cx="50" cy="50" r="14" fill="#060B18" stroke="#00F0FF" stroke-width="2" filter="url(#glow)" />
  <!-- 3 Aerodynamic blades -->
  <path d="M 50 42 C 48 20, 58 10, 64 8 C 66 18, 58 35, 50 42 Z" fill="url(#cyanGrad)" />
  <path d="M 43 54 C 24 59, 12 51, 8 45 C 17 41, 35 46, 43 54 Z" fill="url(#cyanGrad)" transform="rotate(120 50 50)" />
  <path d="M 57 54 C 76 59, 88 51, 92 45 C 83 41, 65 46, 57 54 Z" fill="url(#cyanGrad)" transform="rotate(240 50 50)" />
  <circle cx="50" cy="50" r="6" fill="#00F0FF" filter="url(#glow)" />
</svg>